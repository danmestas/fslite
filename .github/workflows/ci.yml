name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test ${{ matrix.os }} (Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Unit + integration tests
        run: go test -buildvcs=false -timeout 5m ./engine/... ./vfs/...

      - name: WASM cross-compile (wasip1)
        run: GOOS=wasip1 GOARCH=wasm go build -v ./engine/... ./vfs/...

      - name: WASM cross-compile (js)
        run: GOOS=js GOARCH=wasm go build -v ./engine/... ./vfs/...

  linux-mount:
    name: davfs2 mount e2e (native x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install fossil + davfs2
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            fossil davfs2 cadaver sqlite3

      - name: Build fslite
        run: go build -buildvcs=false -o fslite ./cmd/fslite

      # Mounts the daemon with davfs2 (locking left at its default) and drives
      # it the way an editor does: read, atomic save via write-temp-then-rename,
      # drop in a new file, commit, then verify with the fossil CLI that exactly
      # the intended files changed.
      - name: Mount it and use it like a folder
        run: ./.github/scripts/linux-davfs2.sh

  docker-e2e:
    name: cross-container e2e (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # GHA runners are amd64; the Makefile + Dockerfile pick up TARGETARCH
      # from `go env GOARCH` for the host build but we set it explicitly
      # here for clarity and so the layer names match exactly.
      - name: Build image + run cross-container e2e
        env:
          RUN_DOCKER_E2E: "1"
          TARGETARCH: amd64
        run: |
          make docker-image TARGETARCH=amd64
          go test -v -timeout 5m ./docker/
